<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>skaiciuotuvas</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<header>
   
</header>
<main>
    <div class="skaiciuotuvas-grid">
        <div class="output">
          <div data-previous-operand class="prev-operand"></div>
          <div data-current-operand class="curr-operand"></div>
        </div>
    <button data-all-clear class="span-two special">AC</button>
    <button data-delete class="special" >DEL</button>
    <button data-operation>x^2</button>
    <button data-operation>÷</button>
    <button data-operation>x^y</button>
    <button class="skaicius" data-number>1</button>
    <button class="skaicius" data-number>2</button>
    <button class="skaicius" data-number>3</button>
    <button data-operation>*</button>
    <button data-operation>sqrt</button>
    <button class="skaicius" data-number>4</button>
    <button class="skaicius" data-number>5</button>
    <button class="skaicius" data-number>6</button>
    <button data-operation>+</button>
    <button data-operation>sin</button>
    <button class="skaicius" data-number>7</button>
    <button class="skaicius" data-number>8</button>
    <button class="skaicius" data-number>9</button>
    <button data-operation>-</button>
    <button data-operation>cos</button>
    <button class="skaicius" data-number>.</button>
    <button class="skaicius" data-number>0</button>
    <button data-equals class="span-two special2">=</button>
    </div>
</main>
